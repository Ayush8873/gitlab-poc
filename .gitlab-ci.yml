stages:
  - build
  - test
  - deploy

variables:
  IMAGE_NAME: "gitlab-poc-web"
  IMAGE_TAG: "$CI_COMMIT_SHA"
  TEST_CONTAINER: "gitlab-poc-test"
  DEPLOY_CONTAINER: "gitlab-poc-web"
  TEST_PORT: "18081"
  DEPLOY_PORT: "8081"

default:
  tags:
    - poc

build_image:
  stage: build
  script:
    - "docker build --pull -t ${IMAGE_NAME}:${IMAGE_TAG} ."
    - "docker image inspect ${IMAGE_NAME}:${IMAGE_TAG} >/dev/null"
    - "echo 'PASS: Docker image built successfully'"

test_image:
  stage: test
  script:
    - |
      set -eu
      docker rm -f "$TEST_CONTAINER" >/dev/null 2>&1 || true
      trap 'docker rm -f "$TEST_CONTAINER" >/dev/null 2>&1 || true' EXIT

      docker run -d \
        --name "$TEST_CONTAINER" \
        -p "127.0.0.1:${TEST_PORT}:80" \
        "$IMAGE_NAME:$IMAGE_TAG"

      attempt=1
      while [ "$attempt" -le 15 ]; do
        if curl --fail --silent "http://127.0.0.1:${TEST_PORT}/" \
          -o /tmp/cloudnova-test.html; then
          break
        fi

        if [ "$attempt" -eq 15 ]; then
          docker logs "$TEST_CONTAINER" || true
          echo "FAIL: Website did not respond"
          exit 1
        fi

        echo "Waiting for website: ${attempt}/15"
        attempt=$((attempt + 1))
        sleep 2
      done

      grep -Fq "CloudNova" /tmp/cloudnova-test.html
      grep -Fq "Empowering India with Cloud Innovation" /tmp/cloudnova-test.html
      grep -Fq "Our Cloud Services" /tmp/cloudnova-test.html
      grep -Fq "Cloud Hosting" /tmp/cloudnova-test.html
      grep -Fq "DevOps Solutions" /tmp/cloudnova-test.html
      grep -Fq "CloudNova Technologies" /tmp/cloudnova-test.html

      echo "PASS: Website tests passed"

deploy_website:
  stage: deploy
  resource_group: cloudnova-website
  script:
    - |
      set -eu

      docker rm -f "$DEPLOY_CONTAINER" >/dev/null 2>&1 || true

      docker run -d \
        --name "$DEPLOY_CONTAINER" \
        --restart unless-stopped \
        -p "${DEPLOY_PORT}:80" \
        "$IMAGE_NAME:$IMAGE_TAG"

      attempt=1
      while [ "$attempt" -le 15 ]; do
        if curl --fail --silent "http://127.0.0.1:${DEPLOY_PORT}/" \
          -o /tmp/cloudnova-deployed.html; then
          break
        fi

        if [ "$attempt" -eq 15 ]; then
          docker logs "$DEPLOY_CONTAINER" || true
          echo "FAIL: Deployment health check failed"
          exit 1
        fi

        echo "Waiting for deployment: ${attempt}/15"
        attempt=$((attempt + 1))
        sleep 2
      done

      grep -Fq "Empowering India with Cloud Innovation" \
        /tmp/cloudnova-deployed.html

      echo "PASS: CloudNova deployment verified"

  environment:
    name: cloudnova-poc
